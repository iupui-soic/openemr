[pytest]
# Pytest configuration for parallel Selenium test execution

# Test discovery
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options for parallel execution
# -n auto: Use all available CPU cores
# --dist loadscope: Group tests by parametrize scope (same server tests together)
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    server(name): mark test to run on specific server
    slow: marks tests as slow (deselect with '-m "not slow"')

# Timeout for each test (requires pytest-timeout plugin)
# timeout = 300

# Logging
log_cli = false
log_cli_level = INFO

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning